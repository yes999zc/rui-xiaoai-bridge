schema: rui-plugin/v0
id: xiaoai-lx06
name: "Xiaomi AI Speaker Pro (LX06)"
version: 0.2.3
# The bridge is an in-process adapter: it imports rui's device/config contracts and
# runs inside the audio plane. The window is dual on purpose: one plug package serves
# 0.7.x (verified on 0.7.9) and the 0.8.x line, so the ceiling moves to 0.9.0 while
# the floor moves to 0.7.0 - 0.6.x is out of support as of 0.2.3 (see CHANGELOG).
rui_compat: ">=0.7.0 <0.9.0"
license: MIT
maintainer: "rui-xiaoai-bridge maintainers"
homepage: "https://github.com/yes999zc/rui-xiaoai-bridge"
# Out-of-tree install: the operator either puts this directory under
# RUI_PLUGINS_DIR (image/builtin root) or copies the manifest into
# <data_dir>/plugs/xiaoai-lx06 and names the adapter via RUI_ADAPTER_PLUGINS.
# trust=trusted is what lets the loader/registry execute it in-process; it is
# self-asserted metadata, not a sandbox - see README "Trust and install paths".
trust: trusted
devices:
  - devices/lx06.yaml
